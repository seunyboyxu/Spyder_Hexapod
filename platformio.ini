; ESP32 + PCA9685 only. Compile commands never upload automatically.
[platformio]
src_dir = firmware
default_envs = esp32_ble_walk

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_deps = adafruit/Adafruit PWM Servo Driver Library@3.0.2
    adafruit/Adafruit BusIO@1.17.4
monitor_speed = 115200

[env:esp32_servo]
build_src_filter = -<*> +<PlatformioEntry.cpp> +<spyder_esp32_servo_test/>
build_flags = -DSPYDER_SERVO

[env:esp32_classic_leg]
build_src_filter = -<*> +<PlatformioEntry.cpp> +<spyder_esp32_leg_test/>
build_flags = -DSPYDER_CLASSIC_LEG

[env:esp32_ble_leg]
build_src_filter = -<*> +<PlatformioEntry.cpp> +<spyder_esp32_ble_leg_test/>
build_flags = -DSPYDER_BLE_LEG

[env:esp32_ble_four_leg]
build_src_filter = -<*> +<PlatformioEntry.cpp> +<spyder_esp32_ble_four_leg_test/>
build_flags = -DSPYDER_BLE_FOUR_LEG

[env:esp32_ble_walk]
build_src_filter = -<*> +<PlatformioEntry.cpp> +<spyder_esp32_ble_walk/>
build_flags = -DSPYDER_BLE_WALK
